<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign [vite] HMR WebSocket close errors in AI Studio Cloud container
      (function() {
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        function isBenignWsError(args) {
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            var str = '';
            if (typeof arg === 'string') {
              str = arg;
            } else if (arg && typeof arg === 'object') {
              str = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + String(arg);
            }
            if (
              str.indexOf('WebSocket closed without opened') !== -1 ||
              (str.indexOf('WebSocket') !== -1 && (str.indexOf('closed') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('failed') !== -1))
            ) {
              return true;
            }
          }
          return false;
        }

        console.error = function() {
          if (isBenignWsError(arguments)) return;
          origConsoleError.apply(console, arguments);
        };
        console.warn = function() {
          if (isBenignWsError(arguments)) return;
          origConsoleWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var reasonStr = (typeof reason === 'object' && reason !== null ? (reason.message || '') + ' ' + (reason.stack || '') : String(reason || ''));
          if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('closed without opened') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
