<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Stadium Floodlights Glow effect -->
  <circle cx="256" cy="230" r="170" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>

  <!-- Crossed Cricket Bats in Gold -->
  <g transform="translate(256,220) rotate(-45) translate(-256,-220)">
    <!-- Bat 1 -->
    <rect x="242" y="80" width="28" height="260" rx="12" fill="url(#goldGrad)" filter="url(#glow)"/>
    <rect x="248" y="330" width="16" height="70" rx="6" fill="#f8fafc"/>
  </g>
  <g transform="translate(256,220) rotate(45) translate(-256,-220)">
    <!-- Bat 2 -->
    <rect x="242" y="80" width="28" height="260" rx="12" fill="url(#goldGrad)" filter="url(#glow)"/>
    <rect x="248" y="330" width="16" height="70" rx="6" fill="#f8fafc"/>
  </g>

  <!-- Central Cricket Ball -->
  <circle cx="256" cy="220" r="82" fill="url(#ballGrad)" filter="url(#glow)"/>
  <!-- Ball Seam -->
  <path d="M 195 220 Q 256 160 317 220" fill="none" stroke="#fef2f2" stroke-width="4.5" stroke-dasharray="7 4"/>
  <path d="M 195 220 Q 256 280 317 220" fill="none" stroke="#fef2f2" stroke-width="4.5" stroke-dasharray="7 4"/>
  <circle cx="230" cy="195" r="18" fill="#ffffff" opacity="0.35"/>

  <!-- Live Pulse Badge -->
  <g transform="translate(256, 350)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="-62" cy="0" r="6" fill="#ffffff"/>
    <text x="-46" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">LIVE HD</text>
  </g>

  <!-- Title Bottom Ribbon -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="4">CRICKET HD</text>
</svg>
